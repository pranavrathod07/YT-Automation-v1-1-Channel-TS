name: YT Automation Pro - Scheduled Run

on:
  schedule:
    # Subah 8:00 AM, Dopahar 2:00 PM aur Raat 8:00 PM (IST)
    - cron: '30 2,8,14 * * *'

  workflow_dispatch:

permissions:
  contents: write   # commit/push ke liye default GITHUB_TOKEN ko write access chahiye

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f "YT Automation Pro/requirements.txt" ]; then pip install -r "YT Automation Pro/requirements.txt"; fi

      - name: Setup JSON Credentials
        run: |
          mkdir -p "YT Automation Pro/tokens"
          # client_secret.json OAuth client credentials hai
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > "YT Automation Pro/client_secret.json"
          # token ko sahi jagah rakho: tokens/token_<account>.json (config.py ke ACCOUNTS = ["main_channel"] ke hisaab se)
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > "YT Automation Pro/tokens/token_main_channel.json"

      - name: Execute YT Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          cd "YT Automation Pro"
          python main.py

      - name: Commit Updated Tokens & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # tokens/ aur data/ .gitignore me hai (local safety ke liye), isliye force-add karna padega
          git add -f "YT Automation Pro/tokens" "YT Automation Pro/data" 2>/dev/null || true
          git commit -m "Auto-update tokens & state data [skip ci]" || exit 0
          git push
